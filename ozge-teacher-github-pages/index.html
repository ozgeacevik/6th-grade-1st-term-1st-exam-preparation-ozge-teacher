-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.module{border:1px solid var(--line);border-radius:16px;background:#fff;padding:17px;transition:.17s;cursor:pointer;min-height:158px}.module:hover{border-color:#c9c3ff;box-shadow:var(--shadow);transform:translateY(-2px)}.module-top{display:flex;justify-content:space-between;align-items:center}.module-icon{height:38px;width:38px;border-radius:12px;background:#f2efff;display:grid;place-items:center;font-size:18px}.module:nth-child(3n+2) .module-icon{background:#e7f8f4}.module:nth-child(3n) .module-icon{background:#fff4e8}.module .tag{font-size:10px;color:#8b91a5;background:#f5f6f9;border-radius:20px;padding:4px 8px}.module h3{font-size:14px;margin:12px 0 3px}.module p{color:var(--muted);font-size:11px;margin:0 0 13px;min-height:32px}.progress-row{display:flex;align-items:center;gap:8px;color:#8b91a5;font-size:10px}.bar{height:5px;background:#eef0f5;border-radius:8px;flex:1;overflow:hidden}.bar i{height:100%;display:block;background:var(--teal);border-radius:8px}.page-title{margin:1px 0 20px}.page-title h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}.page-title p{color:var(--muted);margin:0;font-size:13px}.module-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.panel h2{font-size:18px;margin:0 0 6px}.panel .sub{font-size:12px;color:var(--muted);margin:0 0 18px}.lesson-block{margin:17px 0}.lesson-block h3{font-size:14px;margin:0 0 9px}.callout{background:#f7f6ff;border-left:3px solid var(--purple);padding:12px 14px;border-radius:0 10px 10px 0;font-size:13px;color:#4e4a71;margin:13px 0}.vocab{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.vocab-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.vocab-item b{font-size:13px}.vocab-item </style></head><body><div class="shell"><aside id="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><strong>Özge Teacher</strong><small>Sınava Hazırlık Atölyesi</small></div></div><div class="nav-label">ÇALIŞMA ALANI</div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><b>🌱 Küçük adımlar, büyük ilerleme</b>Bir konuyu öğren, örnekleri incele, sonra kendini test et.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="menuBtn" aria-label="Menüyü aç">☰</button><div class="crumb"><b id="crumb">Genel Bakış</b> <span id="crumbSub"></span></div></div><div class="top-right"><span class="streak">⚡ <b id="topScore">0</b> puan</span><div class="avatar">6</div></div></header><div class="content" id="app"></div></main></div><script>
const modules=[
{id:'staff',icon:'🏫',title:'Okul çalışanları ve kurallar',desc:'Okuldaki görevler, sorumluluklar ve sınıf kuralları.',label:'Tema 1 • Kelime',time:'8 dk',sections:[{title:'School staff · Okul çalışanları',type:'vocab',items:[['principal / headteacher','müdür'],['counsellor','rehber öğretmen / danışman'],['school nurse','okul hemşiresi'],['librarian','kütüphaneci'],['PE teacher','beden eğitimi öğretmeni'],['cleaner','temizlik görevlisi']]},{title:'School rules · Okul kuralları',type:'examples',items:[['Be punctual.','Dakik ol. · Arrive at school on time.'],['Wear your school uniform.','Okul üniformanı giy.'],['Respect teachers and peers.','Öğretmenlere ve arkadaşlarına saygı göster.'],['Maintain cleanliness and order.','Temizliği ve düzeni koru.'],['Obey activity procedures.','Etkinlik kurallarına uy.']]},{title:'Görevi bul',type:'callout',text:'A librarian lends books. A counsellor listens and guides. A nurse helps sick students. A PE teacher teaches sports and fair play. Bir kelimeyi göreviyle eşleştirerek akılda tut.'}]},
{id:'events',icon:'🏆',title:'Yarışmalar ve kutlamalar',desc:'Etkinlik kelimeleri, fiiller ve duygu bildiren sıfatlar.',label:'Tema 1 • Kelime',time:'9 dk',sections:[{title:'Events · Etkinlik kelimeleri',type:'vocab',items:[['referee','hakem'],['debate','münazara'],['obstacle','engel / zorluk'],['rehearsal','prova'],['spectator','izleyici'],['tournament','turnuva'],['proposer','önergeyi sunan kişi'],['reward','ödül']]},{title:'Action words · Fiiller',type:'vocab',items:[['oppose','karşı çıkmak'],['overcome','üstesinden gelmek'],['cancel','iptal etmek'],['assign','görev vermek'],['inspire','ilham vermek'],['distract','dikkatini dağıtmak'],['permit','izin vermek'],['prioritise','öncelik vermek']]},{title:'Adjectives · Sıfatlar',type:'vocab',items:[['festive','şenlikli'],['rewarding','tatmin edici / faydalı'],['well-argued','iyi gerekçelendirilmiş'],['miserable','çok mutsuz / perişan'],['victory','zafer'],['defeat','yenilgi']]},{title:'Bağlamda kullan',type:'examples',items:[['The debate is well-argued.','Münazara iyi gerekçelendirilmiş.'],['We overcome obstacles together.','Engelleri birlikte aşarız.'],['The referee cancels the match.','Hakem maçı iptal eder.']] }]},
{id:'better',icon:'💡',title:'Daha iyi okul fikirleri',desc:'Erişilebilirlik, altyapı, destek ve geliştirme.',label:'Tema 1 • Kelime',time:'8 dk',sections:[{title:'Improvement words · İyileştirme kelimeleri',type:'vocab',items:[['accessibility','erişilebilirlik'],['infrastructure','altyapı'],['mentorship','mentorluk'],['aid','yardım / destek'],['implement','uygulamaya koymak'],['enhance','geliştirmek / artırmak'],['prioritise','öncelik vermek'],['transform','dönüştürmek']]},{title:'Diğer önemli kelimeler',type:'vocab',items:[['discipline','düzen / disiplin'],['diversity','çeşitlilik'],['confusion','kafa karışıklığı'],['conservation','koruma / tasarruf'],['thoughtfully','düşünceli biçimde'],['quietly','sessizce']]},{title:'Cümle içinde',type:'examples',items:[['We implement a new plan.','Yeni bir planı uygulamaya koyarız.'],['The ramp enhances accessibility.','Rampa erişilebilirliği artırır.'],['A mentor supports younger students.','Bir mentor küçük öğrencilere destek olur.']]},{title:'Sık karıştırılanlar',type:'callout',text:'accessibility = herkesin mekânı kullanabilmesi; infrastructure = okulun fiziksel yapısı (rampalar, koridorlar, sınıflar). Aid isimdir (yardım), help hem isim hem fiil olabilir.'}]},
{id:'reading',icon:'📖',title:'Okuma ve metin tarama',desc:'Beş İngilizce okuma parçası ve kendi cevabını yazabileceğin anlama soruları.',label:'Okuma',time:'15 dk',sections:[{title:'Reading passages · Oku ve cevapla',type:'passageSet',passages:[{title:'Passage 1 · School Clubs',text:'Sinan is a member of the school debate team. The team meets every Tuesday at half past three in the media room. This week, they are preparing for a semi-final debate about making schools more accessible. Sinan is the first proposer. Zeynep goes to the robotics club every Friday. Today, her group is building a small wheelchair lift. Emir is the goalkeeper of the school football team. They usually practise on Mondays and Thursdays.',qs:[{q:'When and where does the debate team meet?',a:'The team meets every Tuesday at half past three in the media room.'},{q:'What is Zeynep’s group building today?',a:'They are building a small wheelchair lift.'},{q:'What position does Emir play, and when does his team practise?',a:'Emir is the goalkeeper. His team usually practises on Mondays and Thursdays.'}]},{title:'Passage 2 · A Healthy School Day',text:'Nurse Selda puts a health tip on the school noticeboard every Monday. She says students should drink six to eight glasses of water a day. At lunch, they can eat fruit, nuts and vegetables. Getting enough sleep is important too. This week, the school nurse is talking to Grade 6 students about healthy habits. The talk starts at ten o’clock in the library. Students should bring their water bottles and listen carefully.',qs:[{q:'How much water should students drink every day?',a:'They should drink six to eight glasses of water every day.'},{q:'Where and when does the talk start?',a:'It starts at ten o’clock in the library.'},{q:'What should students bring to the talk?',a:'They should bring their water bottles.'}]},{title:'Passage 3 · The Robotics Fair',text:'Every spring, our school holds a Robotics and Innovation Fair. This year, the fair is on Friday in the technology lab. Zeynep and her friends are making a model wheelchair lift to help students move around the school more easily. Their IT teacher, Mr Harris, assigns a different task to each group. Zeynep is testing the small motor, while her friend Deniz is painting the model. Visitors can see the projects from two until four in the afternoon.',qs:[{q:'When and where is the fair this year?',a:'The fair is on Friday in the technology lab.'},{q:'Why are the students making a wheelchair lift?',a:'They are making it to help students move around the school more easily.'},{q:'What is Zeynep doing?',a:'She is testing the small motor.'}]},{title:'Passage 4 · Our Eco-School Project',text:'Our class cares about the environment. We usually turn off the lights when we leave a classroom, and we put paper and plastic into separate recycling bins. This month, we are starting a new water conservation project. Our science teacher is showing us how to check for leaking taps. The school is also installing sensor lights in the corridors. We hope these small changes will save energy and water. The Eco Club meets twice a month after school.',qs:[{q:'What does the class usually do when students leave a classroom?',a:'They usually turn off the lights.'},{q:'What project are they starting this month?',a:'They are starting a water conservation project.'},{q:'How often does the Eco Club meet?',a:'It meets twice a month.'}]},{title:'Passage 5 · The Story Competition',text:'Mert loves writing short stories. He usually writes at the school library after lessons. The school story competition is open until Thursday at five o’clock. Mert is writing a story about a brave young astronaut at the moment. His friend Ece is drawing a picture for the story. They want to submit their work before the deadline. The winners will receive a certificate at the school celebration next week. Mert feels excited because this is his first competition.',qs:[{q:'Where does Mert usually write his stories?',a:'He usually writes at the school library.'},{q:'What is Mert writing about at the moment?',a:'He is writing a story about a brave young astronaut.'},{q:'When is the competition deadline?',a:'The deadline is Thursday at five o’clock.'}]}]},{title:'Metin tarama taktiği',type:'callout',text:'Her kelimeyi çevirmeye çalışma. Sorudaki anahtar kelimeyi bul: “when” = zaman, “where” = yer, “who” = kişi, “what” = şey/eylem, “why” = neden. Metinde aynı bilgiyi başka kelimelerle ifade eden cümleyi tara. Cevabı İngilizce, tam cümleyle yazmayı dene.'}]},

{id:'whquestions',icon:'❓',title:'WH Questions · Soru kelimeleri',desc:'What, where, when, who, why, which, whose ve how ile doğru soru kur.',label:'Dil bilgisi',time:'8 dk',sections:[{title:'Soru kelimeleri',type:'table',rows:[['What?','Ne? / Ne yapıyor?','What do you like? — I like science.'],['Who?','Kim? / Kimi?','Who is your teacher? — Ms Green.'],['Where?','Nerede? / Nereye?','Where does Emir practise? — On the pitch.'],['When?','Ne zaman?','When does the club meet? — On Fridays.'],['Why?','Neden?','Why is Cem at home? — Because he is ill.'],['Which?','Hangi? (seçeneklerden)','Which club do you prefer? — Robotics.'],['Whose?','Kimin?','Whose bag is this? — It is Ece’s.'],['How?','Nasıl?','How do you go to school? — By bus.'],['How often?','Ne sıklıkla?','How often do you read? — Every day.'],['How many / much?','Kaç tane / ne kadar?','How many books do you have? — Five.']]},{title:'Soru kurma kalıpları',type:'table',rows:[['Simple Present','WH + do/does + özne + fiilin yalın hâli?','Where does she study?'],['Present Continuous','WH + am/is/are + özne + fiil-ing?','What are they building?'],['Be fiili','WH + am/is/are + özne?','Where is the nurse?'],['Geçmiş zaman (ek bilgi)','WH + did + özne + fiilin yalın hâli?','When did he arrive?']]},{title:'Adım adım örnekler',type:'examples',items:[['Where does Zeynep meet? — She meets in the technology lab.','Where yer sorar. Simple Present soru: does + she + yalın fiil meet.'],['What is Emir doing now? — He is practising penalty kicks.','What eylemi/şeyi; şu an → is + Emir + practising.'],['Why do students recycle paper? — Because they want to help the environment.','Why neden sorar; cevapta because kullanılır.'],['How often does the club meet? — It meets twice a month.','How often sıklık sorar; cevapta every day, once/twice a week gibi ifade kullan.']]},{title:'Dikkat et',type:'callout',text:'Does ile soru kurarken fiile -s ekleme: Where does she live? (Where does she lives? değil.) Present Continuous’ta yardımcı fiil öznenin önüne gelir: What are they doing? “Who” cümlenin öznesiyse do/does kullanmayabiliriz: Who helps the nurse? — The students do.'}]},
{id:'simple',icon:'🔁',title:'Simple Present Tense',desc:'Rutinler, alışkanlıklar, genel gerçekler ve sıklık zarfları.',label:'Dil bilgisi',time:'10 dk',sections:[{title:'Ne zaman kullanılır?',type:'callout',text:'Simple Present; düzenli yaptıklarımız, alışkanlıklar, programlar ve genel gerçekler için kullanılır. “Ne sıklıkla?” sorusuna cevap verir. Örn. I go to school every day. (Her gün okula giderim.)'},{title:'Cümle yapısı',type:'table',rows:[['Olumlu','I/You/We/They + fiil','They play football.'],['Olumlu (he/she/it)','Özne + fiil-s/es','She plays chess.'],['Olumsuz','do not / don’t + fiil','We don’t arrive late.'],['Olumsuz (he/she/it)','does not / doesn’t + fiil','He doesn’t arrive late.'],['Soru','Do + I/you/we/they + fiil?','Do you read every day?'],['Soru (he/she/it)','Does + özne + fiil?','Does she read?']]},{title:'3. tekil şahıs: -s / -es',type:'examples',items:[['play → plays · read → reads','Çoğu fiile -s eklenir.'],['watch → watches · go → goes','-ch, -sh, -ss, -x, -o bitişlerine genellikle -es.'],['study → studies','Sessiz + y → y düşer, -ies gelir.'],['have → has','Düzensiz özel örnek.']]},{title:'Sıklık zarfları (Adverbs of frequency)',type:'table',rows:[['always','her zaman','100%'],['usually','genellikle','80%'],['often','sık sık','60%'],['sometimes','bazen','40%'],['seldom / rarely','nadiren','10%'],['never','asla / hiçbir zaman','0%']]},{title:'Sıklık zarfının cümledeki yeri',type:'examples',items:[['Özne + sıklık zarfı + ana fiil','We always follow the rules. / She usually reads.'],['Özne + be + sıklık zarfı','He is never late. / They are sometimes noisy.'],['Soru: How often …?','How often do you practise? — Twice a week.'],['Zaman ifadeleri','every day/week, on Mondays, once a week, twice a month, at weekends']]},{title:'Dikkat',type:'callout',text:'Olumsuz ve soruda does kullanınca ana fiile -s gelmez: Does she play? (Does she plays? değil.) She doesn’t play. “Usually” gibi zarflar be fiilinden sonra; diğer ana fiillerden önce gelir.'}]},
{id:'continuous',icon:'⏳',title:'Present Continuous',desc:'Şu anda olanlar, geçici durumlar ve zaman ifadeleri.',label:'Dil bilgisi',time:'10 dk',sections:[{title:'Ne zaman kullanılır?',type:'callout',text:'Konuşma anında devam eden işler ve geçici durumlar için. “Şu anda ne oluyor?” sorusuna cevap verir. Look! (Bak!), Listen! (Dinle!), now, right now ve at the moment ipucu olabilir.'},{title:'Cümle yapısı: am / is / are + fiil-ing',type:'table',rows:[['Olumlu','I am (I’m) + fiil-ing','I’m reading now.'],['Olumlu','He/She/It is (’s) + fiil-ing','She is studying now.'],['Olumlu','You/We/They are (’re) + fiil-ing','They’re playing now.'],['Olumsuz','am not / isn’t / aren’t + fiil-ing','He isn’t sleeping.'],['Soru','Am/Is/Are + özne + fiil-ing?','Are you listening?']]},{title:'-ing yazım kuralları',type:'examples',items:[['read → reading','Genellikle fiile -ing eklenir.'],['make → making · write → writing','Sondaki sessiz e düşer.'],['run → running · sit → sitting','Kısa ünlü + tek sessiz harf: son sessiz iki kez yazılır.'],['lie → lying','-ie → -ying']]},{title:'Present Continuous zaman ifadeleri',type:'vocab',items:[['now / right now','şimdi / tam şu anda'],['at the moment','şu anda'],['today / this week','bugün / bu hafta (geçici)'],['Look! / Listen!','Bak! / Dinle! (şu an ipucu)']]},{title:'Örnekler',type:'examples',items:[['Look! The referee is checking the nets.','Bak! Hakem ağları kontrol ediyor.'],['We are building a wheelchair lift at the moment.','Şu anda tekerlekli sandalye asansörü yapıyoruz.'],['Listen! Mr Arda is explaining the rules.','Dinle! Bay Arda kuralları açıklıyor.']]},{title:'Stative verbs · Durum fiilleri',type:'callout',text:'like, love, want, need, know, understand, prefer, believe, remember, forget, mean gibi fiiller çoğunlukla bir durum anlatır ve -ing almaz: I need help. She understands. I don’t remember. “I am needing” genellikle yanlıştır. “Look” (bakmak) eylem fiilidir; “see” (görmek) çoğunlukla durum fiilidir.'}]},
{id:'contrast',icon:'⚖️',title:'Simple mı Continuous mı?',desc:'İki zamanı karşılaştır, zaman ipuçlarını kullan ve doğru seçimi yap.',label:'Dil bilgisi',time:'10 dk',sections:[{title:'Hızlı karar yolu',type:'table',rows:[['Rutin / alışkanlık / genel gerçek','Simple Present','We practise every Monday.'],['Şu anda devam eden iş','Present Continuous','We are practising now.'],['Kalıcı program / rutin','Simple Present','The club meets on Fridays.'],['Bugüne/haftaya özel geçici durum','Present Continuous','This week, we are meeting on Thursday.'],['Durum fiili (need/know/like…)','Genellikle Simple Present','I need my notebook now.']]},{title:'Zaman zarfları ve ifadeleri',type:'table',rows:[['Simple Present','always, usually, often, sometimes, seldom, never','every day, on Mondays, once/twice a week'],['Present Continuous','now, right now, at the moment','today, this week; Look! Listen!']]},{title:'Yan yana karşılaştır',type:'examples',items:[['I read every evening. / I am reading now.','Her akşam okurum. / Şu an okuyorum.'],['She usually walks to school, but today she is taking the bus.','Genellikle yürür, ama bugün otobüse biniyor.'],['The team trains on Mondays. / The team is training at the moment.','Takım pazartesileri çalışır. / Takım şu anda çalışıyor.'],['Do you play tennis? / Are you playing tennis now?','Tenis oynar mısın? / Şu an tenis mi oynuyorsun?']]},{title:'Kendine sor',type:'callout',text:'1) Bu rutin/genel gerçek mi? → Simple Present. 2) Tam şu anda/geçici mi? → Present Continuous. 3) Fiil know, want, like, need gibi durum fiili mi? → Genellikle Simple Present. “Right now” görüp otomatik karar verme; önce fiilin anlamını kontrol et.'}]},
{id:'stative',icon:'🧠',title:'Stative ve action verbs',desc:'Durum fiillerini tanı; hangi fiillere -ing gelmediğini öğren.',label:'Dil bilgisi',time:'6 dk',sections:[{title:'Durum fiilleri (genellikle -ing almaz)',type:'vocab',items:[['like / prefer','sevmek / tercih etmek'],['want / need','istemek / ihtiyaç duymak'],['know / understand','bilmek / anlamak'],['believe / mean','inanmak / anlamına gelmek'],['remember / forget','hatırlamak / unutmak'],['belong / own','ait olmak / sahip olmak']]},{title:'Action verbs · Eylem fiilleri',type:'examples',items:[['The coach is talking now.','Konuşmak bir eylem; şu anda → is talking.'],['The referee checks the nets every match.','Düzenli yapılan eylem → checks.'],['I need a quiet space right now.','Need durum fiilidir; right now olsa da need kullanılır.'],['She understands the rules.','Understand durum fiilidir; understands kullanılır.']]},{title:'Önemli not',type:'callout',text:'Bazı fiiller anlama göre değişebilir: “I think it is a good idea” (bence: durum); “I am thinking about the answer” (üzerinde düşünüyorum: eylem). 6. sınıf düzeyinde önce yaygın durum fiillerini -ing’siz öğren.'}]},
{id:'modals',icon:'🙋',title:'Kibar rica ve teklifler',desc:'May, might, can, could ve shall kullanımını bağlamdan seç.',label:'Dil bilgisi',time:'6 dk',sections:[{title:'Modal verbs · Kullanım',type:'table',rows:[['Can I …?','izin (daha samimi)','Can I borrow your pen?'],['May I …?','izin (daha resmî/kibar)','May I leave the classroom?'],['Could you …?','kibar rica','Could you hold this banner, please?'],['Could we …?','kibar öneri/rica','Could we redesign the classroom?'],['Shall we …?','birlikte öneri','Shall we review the rules?'],['Might','olasılık (kesin değil)','We might inspect the equipment.']]},{title:'Kalıp',type:'callout',text:'Modal + özne + fiilin yalın hâli. “Could you please help?” doğru; “Could you to help?” yanlış. “Might” kesin olmayan ihtimali anlatır. “Shall we…?” birlikte bir şey yapmayı önermenin doğal yoludur.'}]},
{id:'articles',icon:'🧩',title:'A, an, the ve one',desc:'İsimlerden önce doğru belirleyiciyi kullan.',label:'Dil bilgisi',time:'5 dk',sections:[{title:'Hangi durumda?',type:'table',rows:[['a','Tekil, sayılabilir ve ilk kez/belirsiz; sessiz sesle başlayan','a volunteer, a school'],['an','Tekil, sayılabilir ve ilk kez/belirsiz; sesli sesle başlayan','an exhibition, an obstacle'],['the','Belirli, konuşanın/dinleyenin bildiği veya daha önce sözü geçen','the referee, the school rules'],['one','Sayı olarak bir; özellikle miktarı vurgular','Only one marker works.']]},{title:'Örnekler',type:'examples',items:[['We need a volunteer.','Herhangi bir gönüllü.'],['It is an innovative project.','innovative sesli sesle başlar → an.'],['Look at the blackboard!','Belirli/karşımızdaki tahta → the.'],['She has three markers, but only one works.','Üçünden yalnızca bir tanesi.']]},{title:'Not',type:'callout',text:'a/an seçerken yazılan harften çok ilk ses önemlidir. “a university” /yuː/ sesiyle; “an hour” sessiz h sesiyle başlar. Bu seviyede en çok a + sessiz ses, an + sesli ses örneklerini çalış.'}]},
{id:'tags',icon:'🏷️',title:'Question tags',desc:'Cümlenin sonuna kısa onay sorusu ekle.',label:'Dil bilgisi',time:'7 dk',sections:[{title:'Ana kural',type:'callout',text:'Olumlu cümle + olumsuz kısa soru; olumsuz cümle + olumlu kısa soru. Cümledeki yardımcı fiili kullan; yoksa Simple Present’te do/does, Past’ta did kullan.'},{title:'Örnekler',type:'examples',items:[['You want to watch the match, don’t you?','Olumlu want → olumsuz tag; you → you.'],['She is in the library, isn’t she?','is olumlu → isn’t she?'],['They don’t argue, do they?','don’t olumsuz → olumlu do they?'],['The rehearsal starts at 2:30, doesn’t it?','starts (he/she/it) → doesn’t it?'],['We can help, can’t we?','can → can’t; we → we.'],['That isn’t an obstacle, is it?','Olumsuz isn’t → olumlu is it?']]},{title:'Dikkat',type:'callout',text:'İsim yerine uygun zamir gelir: principal → he/she, students → they, school/team → it, you → you. Yardımcı fiilin olumlu/olumsuz olmasına özellikle bak.'}]},
{id:'mix',icon:'💬',title:'Diyalog ve kelimeyi bağlamda kullanma',desc:'Öncelik, hakem, izleyici, tören ve sonuç kelimeleri.',label:'Uygulama',time:'5 dk',sections:[{title:'Turnuva diyaloğu kelimeleri',type:'vocab',items:[['priority','öncelik'],['referee','hakem'],['spectator','izleyici'],['ceremony','tören'],['victory','zafer'],['defeat','yenilgi'],['debate','münazara'],['accessibility','erişilebilirlik']]},{title:'Tamamla ve anlamı yakala',type:'examples',items:[['Our main priority is fair play.','Ana önceliğimiz adil oyundur.'],['Every spectator must sit quietly.','Her izleyici sessizce oturmalı.'],['There will be a medal ceremony.','Bir madalya töreni olacak.'],['We hope for victory, but accept defeat.','Zafer umuyoruz ama yenilgiyi kabul ediyoruz.']]},{title:'Teknik',type:'callout',text:'Boşluğa gelmeden önce cümlenin anlamını ve kelimenin türünü kontrol et: “main … is” sonrası isim; “who is the …?” sonrası kişi/görev; “medal …” sonrası tören olabilir.'}]}

const allQuestions=Object.entries(quizBank).flatMap(([id,qs])=>qs.map((q,i)=>({id,q,i})));let state=JSON.parse(localStorage.getItem('eng6state')||'{}');state.done=state.done||{};state.best=state.best||{};state.points=state.points||0;let current='home',quiz=null,flash=null;
function save(){localStorage.setItem('eng6state',JSON.stringify(state));document.getElementById('topScore').textContent=state.points}
function navRender(){let items=[['home','⌂','Genel Bakış'],['staff','🏫','Okul ve kurallar'],['events','🏆','Yarışmalar'],['better','💡','Daha iyi okul'],['reading','📖','Okuma'],['whquestions','❓','WH Questions'],['simple','🔁','Simple Present'],['continuous','⏳','Present Continuous'],['contrast','⚖️','İki zamanı karşılaştır'],['stative','🧠','Durum fiilleri'],['modals','🙋','Kibar ifadeler'],['articles','🧩','A / an / the'],['tags','🏷️','Question tags'],['mix','💬','Diyalog']];document.getElementById('nav').innerHTML=items.map(([id,ic,label])=>`<button data-nav="${id}" class="${id===current?'active':''}"><span class="ico">${ic}</span>${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));}
function go(id){current=id;quiz=null;flash=null;document.getElementById('sidebar').classList.remove('open');navRender();render()}
function progress(id){return Math.min(100,Math.round((state.best[id]||0)/(quizBank[id]?.length||1)*100))}
function render(){document.getElementById('crumb').textContent=current==='home'?'Genel Bakış':modules.find(m=>m.id===current)?.title||'Çalışma';document.getElementById('crumbSub').textContent=current==='home'?'':'  /  Ders';let app=document.getElementById('app');if(current==='home')app.innerHTML=homeHtml();else if(quiz)app.innerHTML=quizHtml();else if(flash)app.innerHTML=flashHtml();else app.innerHTML=moduleHtml(current);bind()}
function homeHtml(){let studied=Object.values(state.best).filter(x=>x>0).length,total=modules.length;return `<section class="hero"><div class="eyebrow">6. SINIF • İNGİLİZCE SINAV HAZIRLIK</div><h1>Hazır ol, öğren ve<br>kendini kanıtla ✨</h1><div class="hero-actions"><button class="btn btn-white" onclick="go('simple')">Öğrenmeye başla →</button><button class="btn btn-ghost" onclick="startMixed()">Karışık mini test</button></div></section><div class="stats"><div class="stat"><div class="stat-ico">📚</div><div><strong>${studied}/${total}</strong><small>çalışılan konu</small></div></div><div class="stat"><div class="stat-ico">🎯</div><div><strong>${state.points}</strong><small>toplam puan</small></div></div><div class="stat"><div class="stat-ico">✅</div><div><strong>${Object.values(state.best).reduce((a,b)=>a+b,0)}</strong><small>doğru cevap</small></div></div></div><div class="section-head"><div><h2>Öğrenme yolculuğun</h2><p>Her derste önce öğren, sonra kısa testi çöz.</p></div><button class="small-link" onclick="go('contrast')">Önemli konuya git →</button></div><div class="grid">${modules.map((m,i)=>`<article class="module" data-open="${m.id}"><div class="module-top"><div class="module-icon">${m.icon}</div><span class="tag">${m.time}</span></div><h3>${m.title}</h3><p>${m.desc}</p><div class="progress-row"><div class="bar"><i style="width:${progress(m.id)}%"></i></div>${progress(m.id)}%</div></article>`).join('')}</div><p class="footer-note">Created by Özge Altınok Çevik</p>`}
function sectionHtml(s){if(s.type==='vocab')return `<div class="lesson-block"><h3>${s.title}</h3><div class="vocab">${s.items.map(x=>`<div class="vocab-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`;if(s.type==='examples')return `<div class="lesson-block"><h3>${s.title}</h3>${s.items.map(x=>`<div class="example"><em>${x[0]}</em><br><span style="color:var(--muted)">${x[1]}</span></div>`).join('')}</div>`;if(s.type==='table')return `<div class="lesson-block"><h3>${s.title}</h3><div style="overflow:auto"><table class="rule-table"><thead><tr>${(s.rows[0].length===3?['Ne zaman / kural','Yapı / anlam','Örnek']:['Kural','Yapı','Örnek']).map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;if(s.type==='passageSet')return `<div class="lesson-block"><h3>${s.title}</h3><p class="sub">Her parçayı İngilizce oku. Soruların cevabını kendi cümlenle kutuya yaz; sonra “Örnek cevabı göster” ile karşılaştır.</p>${s.passages.map((p,pi)=>`<article class="panel" style="padding:17px;margin:12px 0;background:#fcfcff"><h3>${p.title}</h3><p style="font-size:13px;line-height:1.8;color:#46506b">${p.text}</p>${p.qs.map((q,qi)=>{let key=`read-${pi}-${qi}`;return `<div style="border-top:1px solid var(--line);padding-top:10px;margin-top:10px"><label for="${key}" style="font-size:12px;font-weight:750">${qi+1}. ${q.q}</label><textarea id="${key}" rows="2" placeholder="Write your answer in English…" style="display:block;width:100%;resize:vertical;margin:7px 0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink)"></textarea><details><summary style="font-size:11px;color:var(--purple);cursor:pointer;font-weight:700">Örnek cevabı göster</summary><div class="callout" style="margin-top:8px"><b>Sample answer:</b> ${q.a}</div></details></div>`}).join('')}</article>`).join('')}</div>`;if(s.type==='reading')return `<div class="lesson-block"><h3>${s.title}</h3><div class="callout" style="border:0;white-space:pre-line">${s.text}</div></div>`;return `<div class="callout">${s.text}</div>`}
function moduleHtml(id){let m=modules.find(x=>x.id===id);if(!m)return homeHtml();return `<div class="page-title"><h1>${m.icon} ${m.title}</h1><p>${m.desc} <span style="color:#999">· ${m.time}</span></p></div><div class="module-layout"><article class="panel"><h2>Dersi öğren</h2><p class="sub">Örnekleri oku. İngilizce cümleyi yüksek sesle söylemeyi dene.</p>${m.sections.map(sectionHtml).join('')}<div class="callout"><b>Öğrenme ipucu:</b> Önce örneği kendin cevaplamaya çalış, sonra açıklamasını oku. Yanlış yapmak öğrenmenin bir parçası!</div></article><aside class="side-panel"><div class="panel"><h3>🎯 Şimdi sıra sende</h3><p class="sub">Kısa testte her sorunun cevabını ve nedenini göreceksin.</p><button class="btn purple" onclick="startQuiz('${m.id}')">${state.best[id]?'Tekrar test çöz':'Testi başlat'} →</button><button class="btn outline" onclick="startFlash('${id}')">🗂️ Kelime kartları</button><div style="margin-top:13px"><div class="progress-row"><span>En iyi sonuç</span><div class="bar"><i style="width:${progress(id)}%"></i></div><b>${progress(id)}%</b></div></div></div><div class="panel"><h3>Bu derste</h3><div class="checklist"><div><span>✓</span> Konu anlatımı</div><div><span>✓</span> Örnek cümleler</div><div><span>✓</span> Geri bildirimli test</div><div><span>✓</span> İlerleme kaydı</div></div></div></aside></div>`}
function startQuiz(id){quiz={id,questions:quizBank[id].map((_,i)=>i),pos:0,score:0,locked:false,results:[]};render()}
function startMixed(){let shuffled=[...allQuestions].sort(()=>Math.random()-.5).slice(0,10);quiz={id:'mixed',questions:shuffled,pos:0,score:0,locked:false,results:[],mixed:true};render()}
function getQ(){if(quiz.mixed){let item=quiz.questions[quiz.pos];return {id:item.id,q:quizBank[item.id][item.i]}}return{id:quiz.id,q:quizBank[quiz.id][quiz.questions[quiz.pos]]}}
function quizHtml(){if(quiz.pos>=quiz.questions.length)return resultHtml();let {id,q}=getQ(),n=quiz.pos+1;let feedback=quiz.locked?`<div class="feedback show good">✓ Doğru! <span style="opacity:.85">${q[3]}</span></div>`:quiz.feedback?`<div class="feedback show bad">✗ Henüz değil. Seçimini değiştirebilirsin; bir kez daha düşün ve tekrar dene.${quiz.wrongAttempts>=2?`<br><span style="opacity:.9">İpucu: ${q[3]}</span>`:''}</div>`:'';return `<div class="quiz-wrap"><div class="quiz-top"><span>📝 ${quiz.mixed?'Karışık mini test':modules.find(m=>m.id===id)?.title+' testi'}</span><span>${n} / ${quiz.questions.length}</span></div><div class="quiz-card"><div class="q-progress"><i style="width:${(quiz.pos/quiz.questions.length)*100}%"></i></div><div class="q-kind">SORU ${n} · ÇOKTAN SEÇMELİ</div><div class="question">${q[0]}</div>${q[4]?`<div class="q-context">${q[4]}</div>`:''}<div class="options">${q[1].map((o,i)=>`<button class="option ${quiz.locked&&i===q[2]?'correct':(!quiz.locked&&quiz.lastSelected===i?'wrong':'')}" data-answer="${i}" ${quiz.locked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>${feedback}<div class="quiz-footer"><button class="hint" onclick="toast('İpucu: Önce cümledeki anahtar kelimeyi, zaman ifadesini ve özneyi bul.')">💡 İpucu</button>${quiz.locked?`<button class="btn purple" onclick="nextQ()">${n===quiz.questions.length?'Sonucu gör':'Devam et →'}</button>`:''}</div></div><button class="small-link" style="margin-top:15px" onclick="go('${quiz.id==='mixed'?'home':quiz.id}')">← Derse dön</button></div>`}
function answer(idx){if(quiz.locked)return;let{id,q}=getQ();quiz.lastSelected=idx;if(idx===q[2]){quiz.locked=true;quiz.lastCorrect=true;quiz.explanation=q[3];quiz.score++;if(quiz.wrongAttempts>0)quiz.corrected=(quiz.corrected||0)+1;quiz.results.push({id,correct:true,corrected:quiz.wrongAttempts>0})}else{quiz.wrongAttempts=(quiz.wrongAttempts||0)+1;quiz.feedback=true;quiz.lastCorrect=false}render()}
function nextQ(){quiz.pos++;quiz.locked=false;quiz.feedback=false;quiz.lastCorrect=false;quiz.lastSelected=null;quiz.wrongAttempts=0;render()}
function resultHtml(){let count=quiz.questions.length,pct=Math.round(100*quiz.score/count),id=quiz.id;let shown=quiz.mixed?'Karışık mini test':modules.find(m=>m.id===id)?.title+' testi';if(!quiz.saved){quiz.saved=true;state.points+=quiz.score;if(!quiz.mixed)state.best[id]=Math.max(state.best[id]||0,quiz.score);save()}let msg=pct===100?'Harika! Konuya tamamen hâkimsin.':pct>=75?'Çok iyi! Birkaç noktayı tekrar et.':pct>=50?'İyi bir başlangıç. Yanlışlarına dönüp yeniden dene.':'Öğrenme yolculuğu tekrarlarla güçlenir. Dersi gözden geçirip yeniden dene.';return `<div class="quiz-wrap"><div class="quiz-card result"><div class="medal">${pct>=75?'🏆':'🌱'}</div><div class="q-kind">${shown} tamamlandı</div><h2>${pct}% başarı</h2><p>${msg}</p><div class="result-stats"><div><b>${quiz.score}/${count}</b><small>doğru cevap</small></div><div><b>+${quiz.score}</b><small>puan</small></div><div><b>${quiz.corrected||0}</b><small>düzeltilen cevap</small></div></div><button class="btn purple" onclick="${quiz.mixed?'startMixed()':`startQuiz('${id}')`}">Tekrar çöz</button> <button class="btn outline" onclick="go('${quiz.mixed?'home':id}')">Konuya dön</button></div></div>`}
function startFlash(id){let m=modules.find(x=>x.id===id),words=m.sections.filter(s=>s.type==='vocab').flatMap(s=>s.items);if(!words.length){toast('Bu derste kelime kartı yok; konu anlatımını ve testi incele.');return}flash={id,words,index:0,back:false};render()}
function flashHtml(){let f=flash,w=f.words[f.index];return `<div class="page-title"><h1>🗂️ Kelime kartları</h1><p>${modules.find(m=>m.id===f.id).title} · ${f.index+1} / ${f.words.length}</p></div><div class="quiz-wrap"><div class="panel"><div class="q-progress"><i style="width:${((f.index+1)/f.words.length)*100}%"></i></div><div class="flashcard" onclick="flash.back=!flash.back;render()"><span>${flash.back?'Türkçesi':'İngilizcesi'} · çevirmek için dokun</span><strong>${flash.back?w[1]:w[0]}</strong></div><div class="flash-controls"><button class="btn outline" onclick="flashMove(-1)">← Önceki</button><button class="btn light" onclick="flash.back=!flash.back;render()">Çevir ↻</button><button class="btn purple" onclick="flashMove(1)">Sonraki →</button></div><p class="footer-note" style="text-align:center">Kendin hatırlamaya çalış. Bildiğinde sonraki karta geç.</p></div><button class="small-link" style="margin-top:14px" onclick="go('${f.id}')">← Derse dön</button></div>`}
function flashMove(d){flash.index=(flash.index+d+flash.words.length)%flash.words.length;flash.back=false;render()}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function bind(){document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>go(e.dataset.open));document.querySelectorAll('[data-answer]').forEach(e=>e.onclick=()=>answer(+e.dataset.answer))}
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');navRender();save();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
